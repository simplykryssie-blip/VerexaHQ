name: SAST Evidence (Zoom Beta)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -v "$PWD:/src"             semgrep/semgrep:latest             semgrep scan --config auto --sarif --output /src/semgrep.sarif /src

      - name: Verify SAST report exists
        run: test -s semgrep.sarif

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-evidence
          path: semgrep.sarif
          retention-days: 90
          if-no-files-found: error

  tls-evidence:
    name: TLS 1.2+ production evidence
    runs-on: ubuntu-latest
    steps:
      - name: Collect TLS evidence
        shell: bash
        run: |
          set -euo pipefail
          host="verexahq.com"
          out="tls-evidence.txt"

          {
            echo "Verexa HQ CRM — TLS Evidence"
            echo "Target: $host:443"
            echo "Generated (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo

            echo "=== TLS 1.2 handshake ==="
            if timeout 20 openssl s_client -connect "$host:443" -servername "$host" -tls1_2 -brief </dev/null 2>&1 | tee /tmp/tls12.log; then
              grep -q "Protocol version: TLSv1.2" /tmp/tls12.log || {
                echo "TLS 1.2: FAIL"
                exit 1
              }
              echo "TLS 1.2: PASS"
            else
              echo "TLS 1.2: FAIL (handshake failed)"
              exit 1
            fi
            echo

            echo "=== TLS 1.3 handshake ==="
            if timeout 20 openssl s_client -connect "$host:443" -servername "$host" -tls1_3 -brief </dev/null 2>&1 | tee /tmp/tls13.log; then
              grep -q "Protocol version: TLSv1.3" /tmp/tls13.log || {
                echo "TLS 1.3: FAIL"
                exit 1
              }
              echo "TLS 1.3: PASS"
            else
              echo "TLS 1.3: FAIL (handshake failed)"
              exit 1
            fi
            echo

            echo "=== Certificate summary ==="
            openssl s_client -connect "$host:443" -servername "$host" -tls1_2 </dev/null 2>/dev/null |
              openssl x509 -noout -subject -issuer -dates -fingerprint -sha256
            echo

            echo "=== HTTPS response headers ==="
            curl -sSIL --max-time 20 "https://$host/" | sed -n '1,12p'
            echo

            echo "Conclusion: Production endpoint successfully negotiated TLS 1.2 and TLS 1.3 from the GitHub Actions runner."
          } | tee "$out"

      - name: Verify TLS evidence is non-empty
        run: test -s tls-evidence.txt

      - name: Upload TLS evidence
        uses: actions/upload-artifact@v4
        with:
          name: tls-1-2-plus-evidence
          path: tls-evidence.txt
          retention-days: 90
          if-no-files-found: error
