name: SAST Evidence (Zoom Beta)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/default
          generateSarif: "1"
      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-evidence
          path: semgrep.sarif
          retention-days: 90
          if-no-files-found: warn
